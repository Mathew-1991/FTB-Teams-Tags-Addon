plugins {
    id 'net.minecraftforge.gradle' version '5.1.96'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.yourname'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be left as default or changed to the mappings you prefer.
    // Mappings can be snapshot (snapshot_20230515) or official (1.20.1) or mojang (mojang_mapped).
    // The buildscript uses the net.minecraftforge.gradle plugin, so mappings are configured under the minecraft block.
    // See the FG3 documentation for more information.
}

repositories {
    mavenCentral()
    // Curse Maven for FTB Teams. See curse.maven documentation for file IDs.
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Use the Forge version that matches your 1.20.1 installation. Adjust if necessary.
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // Include FTB Teams as a dependency. Replace FILE_ID with the curseforge file ID of the jar you are using.
    implementation fg.deobf("curse.maven:ftb-teams-forge-404468:FILE_ID")
}

sourceSets.main.resources.srcDir 'src/main/resources'

jar {
    manifest {
        attributes(
                'Specification-Title': project.name,
                'Specification-Vendor': project.group,
                'Specification-Version': version,
                'Implementation-Title': project.name,
                'Implementation-Version': version,
                'Implementation-Vendor': project.group,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.name
            from components.java
        }
    }
}
